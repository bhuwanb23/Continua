<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Continua — continuity intelligence for care coordinators">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#042f2e"/>
      <stop offset="0.55" stop-color="#0b4f4a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#5eead4" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#99f6e4" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>

  <!-- journey line: fragmented records reconstructed into one path -->
  <g transform="translate(790 78) scale(0.8)">
    <path d="M0 150 C 80 150, 90 60, 170 60 S 270 180, 350 120 S 450 40, 520 70" fill="none" stroke="url(#line)" stroke-width="3"/>
    <g fill="#042f2e" stroke="#5eead4" stroke-width="3">
      <circle cx="0" cy="150" r="9"/>
      <circle cx="170" cy="60" r="9"/>
      <circle cx="350" cy="120" r="9"/>
      <circle cx="520" cy="70" r="9"/>
    </g>
    <!-- a verified gap -->
    <g transform="translate(255 125)">
      <circle r="18" fill="#fef3c7" fill-opacity="0.15" stroke="#fcd34d" stroke-width="2" stroke-dasharray="4 4"/>
      <circle r="5" fill="#fcd34d"/>
    </g>
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#ccfbf1" fill-opacity="0.85">
      <text x="-14" y="182">Primary care</text>
      <text x="140" y="38">Surgery</text>
      <text x="330" y="152">Labs</text>
      <text x="490" y="48">Oncology?</text>
      <text x="212" y="170" fill="#fde68a">verified gap</text>
    </g>
    <!-- evidence card -->
    <g transform="translate(330 175)">
      <rect width="210" height="66" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
      <text x="16" y="27" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff">✓ Evidence verified</text>
      <text x="16" y="48" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ccfbf1" fill-opacity="0.85">source · window · absence check</text>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(72 104)">
    <rect width="56" height="56" rx="16" fill="#ffffff" fill-opacity="0.12" stroke="#5eead4" stroke-opacity="0.5"/>
    <path d="M16 28h24M28 16v24" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <text x="76" y="42" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#ffffff" letter-spacing="-1">Continua</text>
  </g>
  <text x="72" y="214" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#ccfbf1">Continuity intelligence for care coordinators</text>
  <text x="72" y="250" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#99f6e4" fill-opacity="0.85">Fragmented records → one source-linked journey → verified gaps → a ranked review queue</text>
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="72" y="278" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
    <text x="147" y="298" text-anchor="middle" fill="#ffffff">Code For DFW 2026</text>
    <rect x="232" y="278" width="168" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
    <text x="316" y="298" text-anchor="middle" fill="#ffffff">Synthetic data only</text>
  </g>
</svg>
